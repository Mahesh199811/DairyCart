services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dairycart
      POSTGRES_USER: dairycart
      POSTGRES_PASSWORD: dairycart-local
    ports:
      - "5433:5432"
    volumes:
      - dairycart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairycart -d dairycart"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dairycart
      DB_USERNAME: dairycart
      DB_PASSWORD: dairycart-local
    ports:
      - "5432:5432"

volumes:
  dairycart-postgres-data:
