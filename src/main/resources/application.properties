spring.application.name=dairy-cart
spring.profiles.default=local
spring.datasource.url=${DB_URL:jdbc:h2:mem:dairycart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
app.admin.username=${ADMIN_USERNAME:localadmin}
app.admin.password=${ADMIN_PASSWORD:dairycart-local-only}
spring.sql.init.mode=always
spring.thymeleaf.cache=false
server.port=${PORT:5432}
server.error.include-message=never
logging.level.org.springframework.jdbc.core=INFO
